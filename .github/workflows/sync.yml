name: Sync upstream

# ------------------------------------------------------------------
# PURPOSE: Keep the fork's `develop` branch in sync with
#          nautechsystems/nautilus_trader:develop daily.
#
# BRANCH STRATEGY:
#   develop  →  pure tracking branch, force-pushed from upstream
#   main     →  your working branch; never auto-merged
#
# REQUIREMENTS:
#   PAT_TOKEN secret — classic PAT with `repo` + `workflow` scopes.
#   The `workflow` scope is required because upstream pushes changes
#   to .github/workflows/ files; the default GITHUB_TOKEN cannot
#   push those files.
#
# HOW TO CREATE PAT_TOKEN:
#   1. GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)
#   2. Scopes: check `repo` and `workflow`
#   3. Go to your fork → Settings → Secrets and variables → Actions
#   4. Add a secret named PAT_TOKEN with the generated token value
# ------------------------------------------------------------------

on:
  schedule:
    - cron: '0 3 * * *'    # Daily at 03:00 UTC
  workflow_dispatch:         # Allow manual trigger at any time

jobs:
  # ----------------------------------------------------------------
  # Job 1: Reset fork's `develop` to exactly match upstream/develop
  # ----------------------------------------------------------------
  sync-develop:
    name: Sync develop from upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}

    steps:
      - name: Validate PAT_TOKEN secret is set
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error::PAT_TOKEN secret is not set."
            echo ""
            echo "To fix this:"
            echo "  1. Go to GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)"
            echo "  2. Generate a token with 'repo' and 'workflow' scopes"
            echo "  3. Go to your fork → Settings → Secrets and variables → Actions"
            echo "  4. Add a secret named PAT_TOKEN with the token value"
            exit 1
          fi
          echo "PAT_TOKEN is configured."

      - name: Checkout fork's develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Set push URL to use the PAT so workflow file pushes are allowed
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Fetch upstream develop
        run: |
          git remote add upstream https://github.com/nautechsystems/nautilus_trader.git || true
          git fetch upstream develop --tags

      - name: Check if sync is needed
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/develop)
          ORIGIN_SHA=$(git rev-parse origin/develop)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "origin_sha=$ORIGIN_SHA"
          echo "upstream_sha=$UPSTREAM_SHA"
          if [ "$UPSTREAM_SHA" = "$ORIGIN_SHA" ]; then
            echo "already_in_sync=true" >> $GITHUB_OUTPUT
            echo "develop is already up to date with upstream."
          else
            echo "already_in_sync=false" >> $GITHUB_OUTPUT
            BEHIND=$(git rev-list --count origin/develop..upstream/develop)
            echo "develop is $BEHIND commits behind upstream/develop."
          fi

      - name: Reset develop to upstream/develop
        id: sync
        if: steps.check.outputs.already_in_sync == 'false'
        run: |
          git checkout develop
          git reset --hard upstream/develop
          git push origin develop --force-with-lease
          echo "synced=true" >> $GITHUB_OUTPUT
          echo "upstream_sha=${{ steps.check.outputs.upstream_sha }}" >> $GITHUB_OUTPUT
          echo "Successfully synced develop to upstream $(git rev-parse --short HEAD)."

      - name: No sync needed
        if: steps.check.outputs.already_in_sync == 'true'
        run: |
          echo "synced=false" >> $GITHUB_OUTPUT
          echo "upstream_sha=${{ steps.check.outputs.upstream_sha }}" >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------
  # Job 2: Create or update a PR from develop → main so you can
  #        manually review and merge upstream changes at your own pace.
  #        Your custom commits on `main` are never auto-merged.
  # ----------------------------------------------------------------
  notify-main:
    name: Create PR develop → main
    runs-on: ubuntu-latest
    needs: sync-develop
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if develop is ahead of main
        id: check_ahead
        run: |
          git fetch origin main develop
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "develop is $AHEAD commits ahead of main."

      - name: Check for existing open PR
        id: check_pr
        if: steps.check_ahead.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --base main --head develop --state open --json number,title --jq '.[0]')
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            PR_NUM=$(echo "$PR" | jq -r '.number')
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
            echo "Existing PR #$PR_NUM found."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR develop → main
        if: steps.check_ahead.outputs.ahead != '0' && steps.check_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "chore: upstream sync — $(date -u '+%Y-%m-%d')" \
            --body "## Upstream Sync

          Daily automated sync from \`nautechsystems/nautilus_trader:develop\`.

          **Upstream SHA**: \`${{ needs.sync-develop.outputs.upstream_sha }}\`
          **Commits ahead of main**: ${{ steps.check_ahead.outputs.ahead }}

          ### Before merging
          - Review the diff for any breaking changes relevant to your custom code on \`main\`
          - Resolve merge conflicts if any (conflicts mean upstream changed something you also changed)
          - Your custom commits on \`main\` will be preserved — this is a normal merge, not a rebase

          ---
          *Auto-created by the sync workflow. Merge manually when ready.*"

      - name: Comment on existing PR with latest upstream SHA
        if: steps.check_ahead.outputs.ahead != '0' && steps.check_pr.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.check_pr.outputs.pr_number }} \
            --body "Upstream sync updated — **$(date -u '+%Y-%m-%d %H:%M UTC')** | SHA: \`${{ needs.sync-develop.outputs.upstream_sha }}\` | ${{ steps.check_ahead.outputs.ahead }} commits ahead of main."

      - name: Already in sync
        if: steps.check_ahead.outputs.ahead == '0'
        run: echo "develop and main are in sync. No PR needed."
